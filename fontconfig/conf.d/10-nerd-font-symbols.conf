<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Nerd Font icons live in the Private Use Area. Ubuntu ships
    fonts-arphic-uming, whose AR PL UMing HK / AR PL UKai HK also claim parts
    of that range, so fontconfig hands U+E627 (the Go glyph) and friends to a
    Chinese font and Neovim renders CJK characters instead of icons.

    <prefer> inserts Symbols Nerd Font Mono directly after the requested
    family, so text still comes from Fira Code / JetBrains Mono and only the
    codepoints they lack fall through to the symbols font, ahead of the CJK
    fonts rather than behind them.
  -->
  <alias>
    <family>monospace</family>
    <prefer><family>Symbols Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>Fira Code</family>
    <prefer><family>Symbols Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>JetBrains Mono</family>
    <prefer><family>Symbols Nerd Font Mono</family></prefer>
  </alias>

  <!--
    The alias above is not enough on its own: Ubuntu ships two dozen CJK
    fontconfig rules that rank AR PL UMing HK above it for any codepoint both
    fonts claim. So drop the Private Use Area from what the arphic fonts
    advertise. Those codepoints have no agreed meaning, nothing asks for them
    in Chinese text, and real CJK coverage is untouched.
  -->
  <match target="scan">
    <test name="family" compare="contains"><string>AR PL U</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0xe000</int><int>0xf8ff</int></range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
