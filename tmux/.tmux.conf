# tmux configuration
#
# Built to sit under the same habits as the neovim config. The mapping is:
#
#   nvim                          tmux
#   ----------------------------  -------------------------------------------
#   leader <Space>                prefix C-a  (see the note below)
#   <C-h/j/k/l> window nav        prefix h/j/k/l  pane nav
#   <S-h>/<S-l> buffer cycle      prefix H/L      window cycle
#   <C-arrow> resize              prefix arrow    resize (repeatable)
#   splitbelow / splitright       - splits down, | splits right
#   mouse = "a"                   mouse on
#   clipboard = "unnamedplus"     set-clipboard on (OSC 52)
#   timeoutlen = 500              repeat-time 500
#
# Nothing is bound in the root key table on purpose: every keystroke that
# isn't preceded by the prefix goes straight through to whatever is running in
# the pane, so nvim keeps all of its mappings intact.

# ── Terminal ─────────────────────────────────────────────────────────────────

# Enable extended key sequences so tmux recognizes Shift+Enter
set -g default-terminal "xterm-kitty"
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'

# Don't read a lone <Esc> as the start of a key sequence -- without this nvim
# takes ~500ms to leave insert mode. Low but non-zero so it survives ssh.
set -sg escape-time 10

# Let nvim see FocusGained/FocusLost, which is what drives :autoread.
set -g focus-events on

# Let kitty's graphics/OSC sequences through tmux untouched (image previews).
set -g allow-passthrough on

set -g history-limit 50000

# ── Prefix ───────────────────────────────────────────────────────────────────

# C-a rather than the usual vim-user alternatives: <Space> is the nvim leader,
# <C-Space> is cmp's completion trigger, C-b is page-up/cmp scroll-docs, and
# C-\ is toggleterm. C-a is the only one of the bunch that's unclaimed.
unbind C-b
set -g prefix C-a
bind C-a send-prefix  # C-a C-a still reaches zsh's beginning-of-line

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── General ──────────────────────────────────────────────────────────────────

set -g mouse on          # matches nvim's mouse = "a"
set -g set-clipboard on  # OSC 52, so yanks land in the system clipboard like
                         # nvim's unnamedplus -- works over ssh, no xclip/pbcopy
set -g status-keys vi    # vi editing at the prefix-: prompt
setw -g mode-keys vi

set -g base-index 1        # window numbers start where the keyboard does
setw -g pane-base-index 1
set -g renumber-windows on # no gaps after closing a window

set -g repeat-time 500   # matches nvim's timeoutlen
set -g display-time 2000

setw -g monitor-activity on
set -g visual-activity off

# ── Panes ────────────────────────────────────────────────────────────────────

# Mnemonic splits that inherit the current directory. tmux already opens the
# new pane right/below, which is nvim's splitright/splitbelow.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation. This is prefixed rather than bare <C-h/j/k/l> because kitty
# binds those to neighboring_window and only passes them through when the
# IS_VIM user var is set, which vim-kitty-navigator sets on the kitty window --
# so inside tmux they never make it this far.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind Tab last-window  # prefix l used to do this

# Resize on the arrows, the way <C-arrow> does in nvim. Repeatable: hold the
# prefix once, then tap.
bind -r Left  resize-pane -L 2
bind -r Down  resize-pane -D 2
bind -r Up    resize-pane -U 2
bind -r Right resize-pane -R 2

# Window cycling, mirroring <S-h>/<S-l> on buffers.
bind -r H previous-window
bind -r L next-window

bind S choose-tree -Zs  # jump to another session

# ── Copy mode ────────────────────────────────────────────────────────────────

# v to select, C-v for blockwise, y to yank -- same fingers as visual mode.
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H     send -X start-of-line
bind -T copy-mode-vi L     send -X end-of-line

# ── Appearance ───────────────────────────────────────────────────────────────
#
# OceanicNext, using the same values as kitty/themes/oceanic-next.conf so the
# tmux status bar and kitty's tab bar read as one surface.

set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#c0c5ce,bg=#1b2b34"

set -g status-left-length 40
set -g status-left "#[fg=#1b2b34,bg=#5fb3b3,bold] #S #[fg=#5fb3b3,bg=#1b2b34,nobold] "

# Active window uses kitty's active-tab colors.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#65737e,bg=#1b2b34] #I #W "
setw -g window-status-current-format "#[fg=#1b2b34,bg=#6699cc,bold] #I #W #[fg=#6699cc,bg=#1b2b34,nobold]"
setw -g window-status-activity-style "fg=#f99157,bg=#1b2b34"

# Right side: a dot while the prefix is held, then host and clock.
set -g status-right-length 40
set -g status-right "#{?client_prefix,#[fg=#fac863]● ,}#[fg=#65737e]#h #[fg=#343d46]#[fg=#c0c5ce,bg=#343d46] %H:%M "

set -g pane-border-style "fg=#343d46"
set -g pane-active-border-style "fg=#6699cc"
set -g message-style "fg=#1b2b34,bg=#fac863,bold"
set -g mode-style "fg=#ffffff,bg=#4f5b66"  # selection colors from the kitty theme
